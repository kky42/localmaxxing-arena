# SciCode-10: frozen. Any change (tasks, pins, agent settings) makes a new bench id, e.g. scicode-10-r2.
id = "scicode-10-v2"
display_name = "SciCode-10-v2"
runner = "harbor"
harbor_version = "0.24.0"
description = "Scientific computing: the 10 hardest SciCode test problems (7-15 sequential sub-steps), Python + numpy/scipy, fractional reward per sub-step. v2: the verifier runs in a separate container, so test_data.h5 is never visible to the agent"

[suite]
dataset = "SciCode (Hugging Face SciCode1/SciCode @ 4510f6a6aa27c43fad7b43da2c59602a86e88480, 80 problems = 65 test + 15 dev; the dev problems with public reference solutions are excluded)"
selection = "select.py: of the 65 non-dev problems, sort by scicode_num_steps desc then problem id asc, take 10"
# Generated by Harbor 0.24.0's scicode adapter (harbor-framework/harbor @ 77d2f15); tasks are vendored here so
# the bench is self-contained and pinned by task_refs.
generated_by = "harbor adapters/scicode @ 77d2f15, uv run python -m scicode.main"
path = "benches/scicode-10-v2/dataset"
n_attempts = 1
tasks = [
  "scicode-13",
  "scicode-12",
  "scicode-11",
  "scicode-77",
  "scicode-71",
  "scicode-72",
  "scicode-73",
  "scicode-68",
  "scicode-69",
  "scicode-80",
]

# Content digest of each task as Harbor resolved it (oracle run 2026-10-20, pinned Dockerfile and packages).
# check.py rejects a trial whose task content differs.
[suite.task_refs]
scicode-13 = "sha256:3930b68f8d25b489c037a157874d3eb47cfbb229f139b3189e7e59c44f9e70f3"
scicode-12 = "sha256:6578525eb056ee24b3432db7598ccdd91445d442ad28507e87d079f107de9dfc"
scicode-11 = "sha256:89f0e5daa79f37b55d76eb9d9fe6425c86374d96f950175cba508249c9e48c41"
scicode-77 = "sha256:3d227e609e9954e2c1b3bb475fb1aae5a0b73480affb3ac78172214f8cf274c3"
scicode-71 = "sha256:439579b975194fc7b3ce395cf62beb1ce17715924a105b0345ee128499724cec"
scicode-72 = "sha256:2a6e6e19fcf3ce3e0da5d220fc7a3897e39fa4ad03f8dd2050c7f68ac41307ff"
scicode-73 = "sha256:9ae0ccbf0a3214431e2a06805f521bf0d03a6916a6542a978ca8a3e0eacfbdb8"
scicode-68 = "sha256:5c962b45719e50fa7d7c48048a8717f059787c6633fcf1119d750931e1a4a76f"
scicode-69 = "sha256:75a4967447e2282ee1777dab97cd379f018a2de273775565735db8c51cc06423"
scicode-80 = "sha256:0dac6f9627f92dc48532fb6b15bc7dab4388f6a141f35eb60caf5d6b27773278"

[agent]
# Scaffold per model family (frozen). Local weights -> pi; OpenAI models via subscription or official API ->
# codex; Anthropic models -> claude-code. A different scaffold answers the same tasks, but scores across
# scaffolds are not strictly comparable: run.json records which agent produced them.
name = "pi"
reasoning_effort = "low"

[agent.by_provider]
openai = "codex"
anthropic = "claude-code"

[agent.versions]
pi = "1.3.0"
codex = "0.163.0"
claude-code = "2.1.304"

[job]
# task.toml ships a 30 min agent timeout; the pi smoke run needed 35 min on a 14-step problem, so 6x.
agent_timeout_multiplier = 6.0
timeout_multiplier = 1.0            # environment / task timeouts as published
# The verifier runs every sub-step with a 1800 s cap; give the whole verifier 60 min so one slow step does
# not eat the budget and turn a partial score into 0.
verifier_timeout_multiplier = 2.0
max_retries = 2                     # infrastructure errors only
environment = "docker"
# The task's docker-compose mounts the ~1 GB SciCode ground truth from the host; see README.md.
required_env = ["HARBOR_SCICODE_TEST_DATA_PATH"]
